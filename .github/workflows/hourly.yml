name: Zero2Sudo Opportunity Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: zero2sudo-opportunity-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Apify secret
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          if [ -z "$APIFY_TOKEN" ]; then
            echo "::error::APIFY_TOKEN is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install OCR and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Zero2Sudo and update tracker
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          IG_USERNAME: zero2sudo
        run: python opportunity_monitor.py

      - name: Commit tracker if changed
        run: |
          if [ -z "$(git status --porcelain -- Zero2Sudo_Opportunity_Tracker.xlsx)" ]; then
            echo "Tracker unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Zero2Sudo_Opportunity_Tracker.xlsx
          git commit -m "Update Zero2Sudo opportunity tracker"

          # The repository may have received unrelated code/docs commits while
          # this job was running. Rebase the tracker commit onto the latest
          # main branch before pushing so the automation does not fail with a
          # non-fast-forward error.
          git pull --rebase origin main
          git push origin HEAD:main
