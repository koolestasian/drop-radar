name: Zero2Sudo Opportunity Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "opportunity_monitor.py"
      - "google_sheets_sync.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/hourly.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: zero2sudo-opportunity-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify Apify secret
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          if [ -z "$APIFY_TOKEN" ]; then
            echo "::error::APIFY_TOKEN is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install OCR and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test tracker persistence
        run: python -m unittest discover -s tests -v

      - name: Back up tracker before cleanup
        uses: actions/upload-artifact@v4
        with:
          name: zero2sudo-pre-run-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: Zero2Sudo_Opportunity_Tracker.xlsx
          if-no-files-found: ignore

      - name: Check Zero2Sudo and update tracker
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SYNC_REQUIRED: ${{ vars.GOOGLE_SYNC_REQUIRED || 'false' }}
          HIGH_PRIORITY_ORGS: ${{ vars.HIGH_PRIORITY_ORGS }}
          IG_USERNAME: zero2sudo
        run: python opportunity_monitor.py --defer-notifications

      - name: Save downloadable tracker snapshot
        uses: actions/upload-artifact@v4
        with:
          name: zero2sudo-tracker-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Zero2Sudo_Opportunity_Tracker.xlsx
            monitor_status.json
            monitor_state.json
            LATEST.md
          if-no-files-found: error

      - name: Commit and verify tracker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Zero2Sudo_Opportunity_Tracker.xlsx monitor_status.json monitor_state.json LATEST.md
          if ! git diff --cached --quiet; then
            git commit -m "Update Zero2Sudo opportunity tracker and check status"
          fi
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::Could not persist tracker to main."
              exit 1
            fi
          done
          git fetch origin main
          git show origin/main:Zero2Sudo_Opportunity_Tracker.xlsx > /tmp/persisted-tracker.xlsx
          cmp Zero2Sudo_Opportunity_Tracker.xlsx /tmp/persisted-tracker.xlsx
          git show origin/main:monitor_status.json > /tmp/persisted-status.json
          cmp monitor_status.json /tmp/persisted-status.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          status = json.loads(Path("monitor_status.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("# Tracker saved and verified on main\n\n")
              for key in ("checked_at", "previous_rows", "new_rows", "total_rows"):
                  summary.write(f"- {key}: {status[key]}\n")
              summary.write(f"\nLive tracker: {status['live_tracker_url']}\n")
              summary.write("\nThe Excel workbook remains available as a backup.\n")
          PY

      - name: Sync and verify Google Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SYNC_REQUIRED: ${{ vars.GOOGLE_SYNC_REQUIRED || 'false' }}
        run: python opportunity_monitor.py --sync-google

      - name: Persist Google Sheet manual-field changes
        run: |
          git add Zero2Sudo_Opportunity_Tracker.xlsx LATEST.md
          if ! git diff --cached --quiet; then
            git commit -m "Sync tracker manual fields from Google Sheets"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Send idempotent alerts after persistence
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          HIGH_PRIORITY_ORGS: ${{ vars.HIGH_PRIORITY_ORGS }}
        run: python opportunity_monitor.py --notify

      - name: Persist notification delivery state
        run: |
          git add monitor_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Record delivered Zero2Sudo alert batches"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
